<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lifeline &mdash; a life simulator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ CHARACTER CREATION SCREEN ============ -->
<section id="create-screen" class="screen">
  <div class="create-card">
    <h1>Lifeline</h1>
    <p class="tagline">Live a whole life, one year at a time.</p>

    <label class="field">
      <span>Name</span>
      <div class="name-row">
        <input type="text" id="name-input" maxlength="24" placeholder="Enter a name&hellip;">
        <button type="button" id="randomize-name-btn" class="btn-secondary" title="Random name">🎲</button>
      </div>
    </label>

    <label class="field">
      <span>Nationality</span>
      <select id="nationality-select"></select>
    </label>

    <label class="field">
      <span>Gender</span>
      <select id="gender-select">
        <option value="Female">Female</option>
        <option value="Male">Male</option>
        <option value="Nonbinary">Nonbinary</option>
      </select>
    </label>

    <button type="button" id="start-btn" class="btn-primary">Start Life</button>
  </div>
</section>

<!-- ============ MAIN GAME SCREEN ============ -->
<section id="game-screen" class="screen hidden">
  <header class="topbar">
    <div class="topbar-title">Lifeline</div>
    <button type="button" id="new-life-topbar-btn" class="btn-secondary small">New Life</button>
  </header>

  <div class="game-layout">

    <!-- LEFT: character summary + stats -->
    <aside class="sidebar">
      <div class="portrait-card">
        <div id="portrait" class="portrait">🙂</div>
        <div class="char-name" id="char-name">&mdash;</div>
        <div class="char-meta" id="char-meta">&mdash;</div>
      </div>

      <div class="stats-card">
        <div class="stat-row">
          <span class="stat-label">❤️ Health</span>
          <div class="stat-bar"><div class="stat-fill health" id="bar-health"></div></div>
          <span class="stat-value" id="val-health">0</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">😊 Happiness</span>
          <div class="stat-bar"><div class="stat-fill happiness" id="bar-happiness"></div></div>
          <span class="stat-value" id="val-happiness">0</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">🧠 Smarts</span>
          <div class="stat-bar"><div class="stat-fill smarts" id="bar-smarts"></div></div>
          <span class="stat-value" id="val-smarts">0</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">✨ Looks</span>
          <div class="stat-bar"><div class="stat-fill looks" id="bar-looks"></div></div>
          <span class="stat-value" id="val-looks">0</span>
        </div>
        <div class="stat-row money-row">
          <span class="stat-label">💰 Money</span>
          <span class="stat-value money" id="val-money">$0</span>
        </div>
      </div>
    </aside>

    <!-- CENTER: life event log -->
    <main class="log-panel">
      <div id="event-log" class="event-log"></div>
    </main>

  </div>

  <!-- BOTTOM: actions -->
  <footer class="action-bar">
    <button type="button" id="age-up-btn" class="btn-primary big">Age Up ⏩</button>
    <div class="activities">
      <button type="button" class="btn-secondary" disabled title="Coming soon">🎓 School</button>
      <button type="button" class="btn-secondary" disabled title="Coming soon">💼 Job</button>
      <button type="button" class="btn-secondary" disabled title="Coming soon">🏠 Assets</button>
      <button type="button" class="btn-secondary" disabled title="Coming soon">❤️ Relationships</button>
      <button type="button" class="btn-secondary" disabled title="Coming soon">🕶️ Crime</button>
      <button type="button" id="activity-health-btn" class="btn-secondary">🏥 Health</button>
    </div>
  </footer>
</section>

<!-- ============ EVENT / ACTIVITY CHOICE MODAL ============ -->
<div id="event-modal" class="modal-overlay hidden">
  <div class="modal-card">
    <p class="modal-prompt" id="event-modal-prompt"></p>
    <div class="modal-choices" id="event-modal-choices"></div>
  </div>
</div>

<!-- ============ DEATH SCREEN ============ -->
<section id="death-screen" class="screen hidden">
  <div class="death-card">
    <div class="death-icon">⚰️</div>
    <h1 id="death-title">You have died.</h1>
    <p class="death-cause" id="death-cause">&mdash;</p>

    <div class="death-summary" id="death-summary"></div>

    <blockquote class="epitaph" id="death-epitaph"></blockquote>

    <button type="button" id="new-life-btn" class="btn-primary big">New Life</button>
  </div>
</section>

<script src="js/data.js"></script>
<script src="js/state.js"></script>
<script src="js/events.js"></script>
<script src="js/engine.js"></script>
<script src="js/main.js"></script>
</body>
</html>
